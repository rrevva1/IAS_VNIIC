services:
  db:
    # Отключаем контейнерную БД: в этом режиме используется PostgreSQL на хосте.
    profiles: ['never']

  php:
    # Для Linux: host.docker.internal через host-gateway.
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${LOCAL_DB_HOST:-host.docker.internal}
      DB_PORT: "${LOCAL_DB_PORT:-5433}"
      DB_NAME: ${LOCAL_DB_NAME:-ias_vniic}
      DB_USER: ${LOCAL_DB_USER:-postgres}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-12345}
